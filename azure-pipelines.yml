name: $(Build.DefinitionName) $(date:yyyyMMdd)$(rev:.r)

stages:
- stage: Build
  jobs:
  - job: Build
    pool:
      vmImage: windows-latest

    variables:
      BuildPlatform: 'any cpu'
      BuildConfiguration: 'release'

    steps:
    - script: 'dotnet --info'
      displayName: 'log dotnet version'

    - pwsh: |
         [int]$buildId = $env:BUILD_BUILDID
         $buildId = $buildId % [uint16]::MaxValue
         [xml]$projectXml=Get-Content "src\Directory.Build.props"
         $propertyGroup = $projectXml.Project.PropertyGroup | Select -First 1
         $version = $propertyGroup.Version.'#text'
         $replacement = "`$1.$buildId`$3"
         $version = $version -replace '(\d+\.\d+)(\.\d+)?(.*)', $replacement
         Write-Host "##vso[task.setvariable variable=PRODUCT_VERSION]$version"
         Write-Host "##vso[build.updatebuildnumber]$env:BUILD_DEFINITIONNAME_$version"
      displayName: 'Get build version'

    - pwsh: |
         Write-Host "PRODUCT_VERSION: $env:PRODUCT_VERSION"
         Write-Host "BUILD_SOURCEBRANCH: $env:BUILD_SOURCEBRANCH"
         Write-Host "BUILD_REASON: $env:BUILD_REASON"
      displayName: 'Show build info'

    - task: MSBuild@1
      displayName: 'Build solution'
      inputs:
        platform: '$(BuildPlatform)'
        configuration: '$(BuildConfiguration)'
        logProjectEvents: true
        createLogFile: true
        msbuildArguments: '-restore'
      env:
        Version: $(PRODUCT_VERSION)

    - task: CopyFiles@2
      displayName: 'Copy Files to: $(build.artifactstagingdirectory)'
      inputs:
        SourceFolder: '$(build.sourcesdirectory)\src\Deploy'
        Contents: '*.*'
        TargetFolder: '$(build.artifactstagingdirectory)'
        CleanTargetFolder: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact: BuildPackages'
      inputs:
        PathToPublish: '$(build.artifactstagingdirectory)'
        ArtifactName: BuildPackages

- stage: CodeSign
  dependsOn: Build
  condition: and(succeeded('Build'), or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
  variables:
    SignTenantId: 16076fdc-fcc1-4a15-b1ca-32c9a255900e
    SignClientId: 037435da-cc79-4d64-83e6-96de49f031ca
    SignKeyVaultUrl: https://sc-resxrm-a4a18888c12d4e.vault.azure.net/
    SignKeyVaultCertificate: ResX-SC
  jobs:
  - job: CodeSign
    displayName: Code Signing
    pool:
      vmImage: windows-latest # Code signing must run on a Windows agent for Authenticode signing (dll/exe)
    steps:
    - checkout: none
    
    # Retrieve unsigned artifacts
    - download: current
      artifact: BuildPackages
      displayName: Download build artifacts

    # Install the code signing tool
    - task: DotNetCoreCLI@2
      inputs:
        command: custom
        custom: tool
        arguments: update --tool-path . --prerelease sign
      displayName: Install SignTool tool

    - pwsh: |
        @('**/ResXManager.*', '**/setup.exe') | Set-Content -Path "$(Pipeline.Workspace)\filelist.txt"
      displayName: 'Create signing file list'

    - pwsh: Rename-Item -Path "$(Pipeline.Workspace)\BuildPackages\Publish.zip" -NewName Publish.clickonce
      displayName: 'Rename click-once archive to .clickonce'

    - pwsh: |
        .\sign code azure-key-vault `
        "**/*.*" `
        --base-directory "$(Pipeline.Workspace)\BuildPackages" `
        --file-list "$(Pipeline.Workspace)\filelist.txt" `
        --publisher-name "tom-englert" `
        --description "ResX Resource Manager" `
        --description-url "https://github.com/dotnet/ResXResourceManager" `
        --azure-key-vault-tenant-id "$(SignTenantId)" `
        --azure-key-vault-client-id "$(SignClientId)" `
        --azure-key-vault-client-secret "$(SignClientSecret2)" `
        --azure-key-vault-certificate "$(SignKeyVaultCertificate)" `
        --azure-key-vault-url "$(SignKeyVaultUrl)"
      displayName: Sign packages

    - pwsh: Rename-Item -Path "$(Pipeline.Workspace)\BuildPackages\Publish.clickonce" -NewName Publish.zip
      displayName: 'Rename click-once archive back to .zip'

    # Publish the signed packages
    - publish: $(Pipeline.Workspace)/BuildPackages
      displayName: Publish Signed Packages
      artifact: SignedPackages

- stage: Upload
  dependsOn: CodeSign
  jobs:
  - job: Upload
    displayName: Upload to VSIX gallery
    pool:
      vmImage: windows-latest
    steps:
    - checkout: none
    
    - download: current
      artifact: SignedPackages
      displayName: Download build artifacts
    
    - pwsh: |
        $vsixFile = "$(Pipeline.Workspace)\SignedPackages\ResXManager.Vsix.vsix"
        $repository = "https://github.com/$env:BUILD_REPOSITORY_NAME"
        $issueTracker = "$repository/issues"
        $uploadUri = "https://www.vsixgallery.com/api/upload?repo=$([uri]::EscapeDataString($repository))&issuetracker=$([uri]::EscapeDataString($issueTracker))"

        Write-Host "Uploading $vsixFile to VSIX Gallery for $repository"
        Invoke-WebRequest -Uri $uploadUri -Method Post -Form @{ file = Get-Item $vsixFile } | Out-Null
      displayName: 'Publish to vsix-gallery'
      continueOnError: true

- stage: Deploy
  displayName: Deploy
  dependsOn: CodeSign
  condition: and(succeeded('CodeSign'), eq(variables['Build.Reason'], 'Manual'), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
  jobs:
  - deployment: DeployClickOnce
    displayName: Deploy ClickOnce package to Azure Web App
    environment: Deployment # requires approval checks configured on the 'Deployment' environment in Azure DevOps
    pool:
      vmImage: windows-latest
    strategy:
      runOnce:
        deploy:
          steps:
          # publish the signed click-once package to the Azure App Service
          - task: AzureRmWebAppDeployment@5
            displayName: 'Azure App Service Deploy: clickonce-tom-englert'
            inputs:
              azureSubscription: ClickOnceNew
              WebAppName: clickonce-tom-englert
              deployToSlotOrASE: true
              ResourceGroupName: ClickOnce
              VirtualApplication: ResXResourceManager
              packageForLinux: '$(Pipeline.Workspace)/SignedPackages/Publish.zip'
              enableCustomDeployment: true
              TakeAppOfflineFlag: false
              RemoveAdditionalFilesFlag: true
              ExcludeFilesFromAppDataFlag: false